name: Build Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase (Docker)
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start Supabase stack
        run: supabase start -x studio -x imgproxy -x logflare -x vector -x edge-runtime -x realtime -x mailpit -x supavisor -x postgres-meta

      - name: Run tests against local database
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          PASSWORD: test-password-123
        run: |
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o env | grep -E '^ANON_KEY=' | cut -d= -f2 | tr -d '"')
          npm run test